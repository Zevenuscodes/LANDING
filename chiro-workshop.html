<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Loading…</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;900&family=Montserrat:wght@700;800;900&display=swap');

    *{margin:0;padding:0;box-sizing:border-box;}

    body{
      background:#f7faf5;color:#0f3d1e;
      font-family:'Noto Sans Devanagari','Montserrat',sans-serif;
      overflow-x:hidden;padding-bottom:100px;
    }

    /* ── BG ── */
    .bg-decor{position:fixed;inset:0;z-index:-1;
      background:linear-gradient(170deg,#ffffff 0%,#f1f8ef 55%,#fff8e1 100%);}

    /* ── STICKY BAR ── */
    .sticky-bar{position:fixed;bottom:0;left:0;right:0;z-index:9999;
      background:#0f5a26;border-top:3px solid #f5c518;
      padding:10px 14px;display:flex;align-items:center;justify-content:center;gap:10px;
      box-shadow:0 -6px 30px rgba(15,90,38,.35);}
    .sticky-arrow{color:#f5c518;font-size:24px;animation:arr-blink .6s ease-in-out infinite alternate;}
    @keyframes arr-blink{from{opacity:.3;transform:translateX(0)}to{opacity:1;transform:translateX(-5px)}}
    .sticky-arrow.r{animation-name:arr-blink-r;}
    @keyframes arr-blink-r{from{opacity:.3;transform:translateX(0)}to{opacity:1;transform:translateX(5px)}}
    .sticky-btn{flex:1;max-width:380px;display:flex;align-items:center;justify-content:center;gap:8px;
      background:linear-gradient(135deg,#1a7a36 0%,#22963f 50%,#1a7a36 100%);
      color:#fff;font-family:'Montserrat','Noto Sans Devanagari',sans-serif;
      font-size:clamp(16px,4.5vw,21px);font-weight:900;
      text-decoration:none;padding:13px 20px;border-radius:40px;border:3px solid #f5c518;
      letter-spacing:.3px;animation:sticky-pulse 1s ease-in-out infinite;
      overflow:hidden;position:relative;-webkit-tap-highlight-color:transparent;}
    @keyframes sticky-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
    .sticky-btn::before,.join-btn::before{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
      animation:shimmer 1.8s ease-in-out infinite;}
    @keyframes shimmer{0%{left:-100%}100%{left:200%}}

    /* ── PAGE ── */
    .page{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;
      padding:16px 14px 50px;}
    .w{width:100%;max-width:500px;}

    /* ── TOP BADGE ── */
    .top-badge{background:#0f5a26;color:#fff;font-size:clamp(12px,3.5vw,15px);font-weight:800;
      padding:10px 22px;border-radius:30px;margin-bottom:14px;border:2px solid #f5c518;
      text-align:center;animation:badge-pulse 2.5s ease-in-out infinite;}
    @keyframes badge-pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,197,24,.5)}50%{box-shadow:0 0 0 8px rgba(245,197,24,0)}}

    /* ── POSTER ── */
    .poster-wrap{border-radius:20px;overflow:hidden;border:4px solid #0f5a26;background:#fff;
      box-shadow:0 10px 40px rgba(15,90,38,.2);margin-bottom:22px;position:relative;}
    .poster-wrap img{width:100%;display:block;}
    .poster-ribbon{position:absolute;top:16px;right:-8px;background:#e53935;color:#fff;
      font-size:12px;font-weight:900;padding:6px 18px 6px 12px;border-radius:4px 0 0 4px;
      box-shadow:0 2px 8px rgba(0,0,0,.3);animation:flicker 1.5s infinite;}
    @keyframes flicker{0%,94%,100%{opacity:1}95%{opacity:.3}97%{opacity:1}98%{opacity:.2}}

    /* ── HERO ── */
    .hero{text-align:center;margin-bottom:18px;}
    .hero .pill{display:inline-block;background:#0f5a26;color:#fff;font-family:'Montserrat',sans-serif;
      font-weight:900;font-size:clamp(16px,4.5vw,22px);padding:6px 22px;border-radius:30px;}
    .hero h1{font-family:'Montserrat','Noto Sans Devanagari',sans-serif;
      font-size:clamp(36px,10.5vw,58px);font-weight:900;line-height:1.1;color:#0f5a26;margin-top:10px;}
    .hero .hi{font-size:clamp(20px,5.5vw,28px);font-weight:900;color:#0f3d1e;margin-top:4px;}
    .hero .swoosh{width:60%;height:6px;margin:12px auto 0;border-radius:6px;
      background:linear-gradient(90deg,transparent,#f5c518,transparent);}

    /* ── EVENT FACTS ── */
    .facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
    .fact{background:#fff;border:2px solid #0f5a26;border-radius:16px;padding:14px 10px;text-align:center;
      box-shadow:0 4px 0 #0f5a26;}
    .fact .ic{font-size:26px;display:block;}
    .fact b{display:block;font-family:'Montserrat','Noto Sans Devanagari',sans-serif;
      font-size:clamp(17px,4.8vw,22px);font-weight:900;color:#0f5a26;margin-top:2px;}
    .fact small{font-size:13px;color:#4a6b55;font-weight:700;}

    /* ── COUNTDOWN ── */
    .countdown{background:#0f5a26;border-radius:16px;padding:14px 12px;margin-bottom:18px;text-align:center;}
    .countdown .lbl{color:#f5c518;font-weight:900;font-size:clamp(14px,3.8vw,16px);margin-bottom:8px;}
    .cd-row{display:flex;justify-content:center;gap:8px;}
    .cd-box{background:#fff;border-radius:12px;min-width:62px;padding:8px 4px;}
    .cd-box b{display:block;font-family:'Montserrat',sans-serif;font-size:26px;font-weight:900;color:#0f5a26;line-height:1.1;}
    .cd-box small{font-size:12px;font-weight:700;color:#4a6b55;}

    /* ── SEATS BANNER ── */
    .seats{background:#fff3cd;border:2px dashed #e0a800;color:#7a5200;font-weight:900;
      font-size:clamp(14px,3.9vw,17px);padding:13px 16px;border-radius:14px;text-align:center;margin-bottom:20px;}

    /* ── DIVIDER ── */
    .divider{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
    .divider-line{flex:1;height:2px;background:linear-gradient(90deg,transparent,#0f5a26,transparent);}
    .divider-text{font-size:clamp(14px,3.9vw,17px);font-weight:900;color:#0f5a26;white-space:nowrap;}

    /* ── CHIPS ── */
    .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px;}
    .chip{background:#e6f4ea;border:1px solid #9ccfa8;color:#0f5a26;font-size:clamp(12px,3.2vw,14px);
      font-weight:800;padding:8px 14px;border-radius:30px;}

    /* ── HIGHLIGHTS ── */
    .highlights{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
    .hl{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid rgba(15,90,38,.15);
      border-left:5px solid #f5c518;border-radius:12px;padding:14px 16px;box-shadow:0 2px 10px rgba(15,90,38,.06);}
    .hl .ic{font-size:28px;flex-shrink:0;}
    .hl b{display:block;font-size:clamp(14px,3.8vw,16px);font-weight:900;color:#0f3d1e;line-height:1.3;}
    .hl span{font-size:clamp(12px,3.2vw,14px);color:#4a6b55;font-weight:600;}

    /* ── CARD ── */
    .card{background:#fff;border:1px solid rgba(15,90,38,.15);border-radius:18px;padding:20px 18px;
      margin-bottom:18px;box-shadow:0 4px 18px rgba(15,90,38,.07);}
    .card-title{font-size:clamp(16px,4.5vw,20px);font-weight:900;color:#0f5a26;text-align:center;
      margin-bottom:12px;padding-bottom:10px;border-bottom:3px solid #f5c518;}
    .li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid rgba(15,90,38,.08);
      font-size:clamp(14px,4vw,16px);font-weight:600;line-height:1.5;}
    .li:last-child{border-bottom:none;}

    /* ── WHO GRID ── */
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
    .box{background:#fff;border:1px solid rgba(15,90,38,.15);border-radius:14px;padding:14px 10px;text-align:center;}
    .box .ic{font-size:26px;display:block;margin-bottom:6px;}
    .box span{font-size:clamp(12px,3.2vw,14px);font-weight:700;line-height:1.4;}

    /* ── ARROWS ── */
    .arrow-row{display:flex;gap:8px;justify-content:center;margin-bottom:6px;}
    .arrow{color:#22963f;font-size:32px;animation:bounce-d .6s ease-in-out infinite alternate;}
    .arrow:nth-child(2){animation-delay:.1s}.arrow:nth-child(3){animation-delay:.2s}
    @keyframes bounce-d{from{transform:translateY(-6px);opacity:.5}to{transform:translateY(6px);opacity:1}}

    /* ── JOIN BUTTON ── */
    .join-wrap{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;}
    .side-arr{color:#f5c518;font-size:26px;text-shadow:0 0 1px #0f5a26;}
    .side-arr.l{animation:arr-blink .7s ease-in-out infinite alternate;}
    .side-arr.r{animation:arr-blink-r .7s ease-in-out infinite alternate;}
    .join-btn{display:inline-flex;align-items:center;justify-content:center;
      background:linear-gradient(135deg,#1a7a36 0%,#22963f 50%,#1a7a36 100%);
      color:#fff;font-family:'Montserrat','Noto Sans Devanagari',sans-serif;
      font-size:clamp(22px,6vw,30px);font-weight:900;text-decoration:none;
      padding:14px 38px;border-radius:50px;border:4px solid #f5c518;
      box-shadow:0 8px 24px rgba(15,90,38,.35);animation:btn-pulse 1.1s ease-in-out infinite;
      overflow:hidden;position:relative;-webkit-tap-highlight-color:transparent;}
    @keyframes btn-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    .join-btn:active{transform:scale(.96);}
    .hint{color:#4a6b55;font-size:13px;text-align:center;margin-bottom:24px;font-weight:600;}

    /* ── CALL BOX ── */
    .call-box{background:#fff;border:2px solid #0f5a26;border-radius:18px;padding:18px;text-align:center;margin-bottom:20px;}
    .call-box p{font-weight:800;font-size:clamp(14px,3.9vw,16px);}
    .call-btn{display:inline-block;margin-top:10px;background:#f5c518;color:#0f3d1e;text-decoration:none;
      font-family:'Montserrat',sans-serif;font-weight:900;font-size:clamp(20px,5.5vw,26px);
      padding:10px 26px;border-radius:40px;}

    /* ── URGENCY ── */
    .urgency{background:linear-gradient(90deg,#c62828,#e53935,#c62828);background-size:200% 100%;
      animation:urg 2s linear infinite;color:#fff;font-weight:900;font-size:clamp(13px,3.8vw,16px);
      padding:14px 20px;border-radius:12px;text-align:center;margin-bottom:20px;}
    @keyframes urg{0%{background-position:0%}100%{background-position:200%}}

    .footer{color:#6b8a74;font-size:12px;text-align:center;max-width:420px;line-height:1.6;}
  </style>
</head>
<body>
<div class="bg-decor"></div>
<div class="page" id="page-root"></div>
<div class="sticky-bar" id="sticky-bar"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════

    { icon: "📍", main: "Dehradun",    sub: "देहरादून" },
  ],

  /* ── Seats banner ── */
  seatsText: "⚠️ सीमित सीटें उपलब्ध हैं — अभी रजिस्ट्रेशन करें!",

  /* ── Technique chips ── */
  chips: [
    "Spinal Assessment", "Neck Adjustment", "Back Adjustment", "Posture Correction",
    "Sciatica", "Cervical Pain", "Frozen Shoulder", "Joint Mobilization"
  ],

  /* ── Highlights ── */
  highlights: [
    { icon: "🦴", title: "1 दिन की हैंड्स-ऑन ट्रेनिंग", sub: "देहरादून में प्रत्यक्ष (Offline) वर्कशॉप" },
    { icon: "👐", title: "लाइव डेमो और प्रैक्टिकल अभ्यास", sub: "विशेषज्ञ की निगरानी में खुद करके सीखें" },
    { icon: "🩻", title: "रीढ़ और जोड़ों की जाँच की विधि", sub: "सही आकलन, सही तकनीक" },
    { icon: "🏥", title: "अपनी प्रैक्टिस में तुरंत अपनाएं", sub: "क्लिनिक में उपयोग के लिए व्यावहारिक ज्ञान" },
  ],

  /* ── What you'll learn ── */
  learnTitle: "📜 क्या सीखेंगे आप?",
  learnItems: [
    "कायरोप्रैक्टिक के मूल सिद्धांत और रीढ़ की संरचना",
    "मरीज़ की जाँच — पोस्चर, मूवमेंट और दर्द का आकलन",
    "गर्दन (Cervical) और कमर (Lumbar) एडजस्टमेंट की तकनीकें",
    "सायटिका, स्लिप डिस्क और कमर दर्द में उपयोगी तरीके",
    "कंधे और अन्य जोड़ों का मोबिलाइज़ेशन",
    "सुरक्षा, सावधानियां और कब एडजस्टमेंट नहीं करना चाहिए",
  ],

  /* ── Who should join ── */
  whoTitle: "👥 कौन जुड़ सकता है?",
  who: [
    { icon: "👨‍⚕️", text: "BAMS / BHMS / MBBS डॉक्टर" },
    { icon: "🏃", text: "फिज़ियोथेरेपिस्ट" },
    { icon: "🌿", text: "पंचकर्म व मसाज थेरेपिस्ट" },
    { icon: "🎓", text: "हेल्थकेयर स्टूडेंट्स" },
  ],

  /* ── Buttons ── */
  btnText: "Apply Now »",
  btnHint: "👆 बटन दबाएं और WhatsApp ग्रुप से जुड़कर रजिस्ट्रेशन करें",
  callText: "📞 जानकारी व रजिस्ट्रेशन के लिए अभी संपर्क करें",

  /* ── Urgency ── */
  urgencyText: "⏰ सीमित सीटें — आज ही Apply करें, देर न करें! ⏰",

  /* ── Footer ── */
  footerLine1: "WhatsApp Community से जुड़ने पर आप WhatsApp की शर्तों से सहमत होते हैं।",
  footerLine2: "वर्कशॉप से जुड़ी पूरी जानकारी WhatsApp ग्रुप में दी जाएगी।",

/* ═══════════════════════════════════════════════════════════════════════════
   ⛔  DO NOT EDIT BELOW THIS LINE — नीचे कुछ न बदलें
   ═══════════════════════════════════════════════════════════════════════════ */
</script>

<script>
  function link(extraStyle){
    return '<a class="join-btn" href="'+CONFIG.whatsappLink+'" target="_blank" rel="noopener noreferrer"'
      +(extraStyle?' style="'+extraStyle+'"':'')+'>'+CONFIG.btnText+'</a>';}
  function joinWrap(){
    return '<div class="join-wrap"><span class="side-arr l">&#9658;&#9658;</span>'+link()
      +'<span class="side-arr r">&#9668;&#9668;</span></div>';}
  var arrows='<div class="arrow-row"><span class="arrow">&#9660;</span><span class="arrow">&#9660;</span><span class="arrow">&#9660;</span></div>';
  var tel='tel:+91'+CONFIG.phone.replace(/^0/,'');

  var factsHTML=CONFIG.facts.map(function(f){
    return '<div class="fact"><span class="ic">'+f.icon+'</span><b>'+f.main+'</b><small>'+f.sub+'</small></div>';}).join('');
  var chipsHTML=CONFIG.chips.map(function(c){return '<span class="chip">'+c+'</span>';}).join('');
  var hlHTML=CONFIG.highlights.map(function(h){
    return '<div class="hl"><span class="ic">'+h.icon+'</span><div><b>'+h.title+'</b><span>'+h.sub+'</span></div></div>';}).join('');
  var learnHTML=CONFIG.learnItems.map(function(i){
    return '<div class="li"><span>✅</span><span>'+i+'</span></div>';}).join('');
  var whoHTML=CONFIG.who.map(function(w){
    return '<div class="box"><span class="ic">'+w.icon+'</span><span>'+w.text+'</span></div>';}).join('');

  document.title=CONFIG.pageTitle;

  document.getElementById('page-root').innerHTML=
    '<div class="top-badge w">'+CONFIG.topBadge+'</div>'
    +arrows+joinWrap()
    +'<div style="height:10px"></div>'

    +'<div class="poster-wrap w">'
    +'<img src="'+CONFIG.posterImage+'" alt="One Day Chiropractor Training Workshop" onerror="this.parentElement.style.display=\'none\'" />'
    +'<div class="poster-ribbon">'+CONFIG.posterRibbon+'</div></div>'

    +'<div class="hero w"><span class="pill">'+CONFIG.heroPill+'</span>'
    +'<h1>'+CONFIG.heroMain+'</h1>'
    +'<div class="hi">'+CONFIG.heroSub+'</div>'
    +'<div class="hi" style="font-size:clamp(16px,4.4vw,20px);color:#22963f">'+CONFIG.heroHindi+'</div>'
    +'<div class="swoosh"></div></div>'

    +'<div class="facts w">'+factsHTML+'</div>'

    +'<div class="countdown w" id="countdown"><div class="lbl">⏳ वर्कशॉप शुरू होने में</div>'
    +'<div class="cd-row"><div class="cd-box"><b id="cd-d">0</b><small>दिन</small></div>'
    +'<div class="cd-box"><b id="cd-h">0</b><small>घंटे</small></div>'
    +'<div class="cd-box"><b id="cd-m">0</b><small>मिनट</small></div>'
    +'<div class="cd-box"><b id="cd-s">0</b><small>सेकंड</small></div></div></div>'

    +'<div class="seats w">'+CONFIG.seatsText+'</div>'

    +'<div class="divider w"><div class="divider-line"></div><div class="divider-text">🦴 क्या सीखेंगे</div><div class="divider-line"></div></div>'
    +'<div class="chips w">'+chipsHTML+'</div>'
    +'<div class="highlights w">'+hlHTML+'</div>'

    +arrows+joinWrap()
    +'<p class="hint">'+CONFIG.btnHint+'</p>'

    +'<div class="card w"><div class="card-title">'+CONFIG.learnTitle+'</div>'+learnHTML+'</div>'

    +'<div class="divider w"><div class="divider-line"></div><div class="divider-text">'+CONFIG.whoTitle+'</div><div class="divider-line"></div></div>'
    +'<div class="grid2 w">'+whoHTML+'</div>'

    +'<div class="call-box w"><p>'+CONFIG.callText+'</p><a class="call-btn" href="'+tel+'">'+CONFIG.phone+'</a></div>'

    +'<div class="urgency w">'+CONFIG.urgencyText+'</div>'
    +link('margin-bottom:28px;')
    +'<div class="footer">'+CONFIG.footerLine1+'<br>'+CONFIG.footerLine2+'</div>';

  document.getElementById('sticky-bar').innerHTML=
    '<span class="sticky-arrow">&#9658;&#9658;</span>'
    +'<a class="sticky-btn" href="'+CONFIG.whatsappLink+'" target="_blank" rel="noopener noreferrer">📲 '+CONFIG.btnText+'</a>'
    +'<span class="sticky-arrow r">&#9668;&#9668;</span>';

  /* Countdown — hides itself once the workshop has started */
  var target=new Date(CONFIG.eventDate).getTime();
  function tick(){
    var ms=target-Date.now();
    if(ms<=0){document.getElementById('countdown').style.display='none';return;}
    var s=Math.floor(ms/1000);
    document.getElementById('cd-d').textContent=Math.floor(s/86400);
    document.getElementById('cd-h').textContent=Math.floor(s%86400/3600);
    document.getElementById('cd-m').textContent=Math.floor(s%3600/60);
    document.getElementById('cd-s').textContent=s%60;
    setTimeout(tick,1000);}
  tick();
</script>
</body>
</html>
